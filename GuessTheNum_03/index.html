<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Guess the Number</title>
</head>
<body>

    <header class="heading">
        <h1>Number Guessing Game</h1>
    </header>

    <div class="game">

        <h2>Try and guess a random number between 1 and 100.</h2>

        <h3>You have 10 attempts to guess the right number.</h3>

        <h1>Guess a Number</h1>

        <input
            type="number"
            id="guessField"
            class="input"
            min="1"
            max="100"
            placeholder="Enter a number">

        <div class="button-container">
            <button id="submit" class="submit">
                Submit Guess
            </button>
        </div>

        <div class="result">

            <p>
                Previous Guesses:
                <span id="guesses"></span>
            </p>

            <p>
                Guesses Remaining:
                <span id="remaining">10</span>
            </p>

            <h3 id="message"></h3>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
